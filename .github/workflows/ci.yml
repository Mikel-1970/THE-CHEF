name: Validar The Chef
on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Instalar dependencias
        run: npm install
      - name: Auditoría de vulnerabilidades críticas de producción
        run: npm audit --omit=dev --audit-level=critical
      - name: Auditoría estática Fase 1
        run: npm run audit:phase1
      - name: Compilar y validar TypeScript
        run: npm run build
