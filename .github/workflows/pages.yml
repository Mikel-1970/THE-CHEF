name: Publicar El Chef en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Generar metadatos de versión
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          node -e "const fs=require('fs'); const pkg=require('./package.json'); fs.writeFileSync('public/version.json', JSON.stringify({version: pkg.version, commit: process.env.GITHUB_SHA}, null, 2) + '\n');"

      - name: Compilar PWA
        run: npm run build

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en Pages
        id: deployment
        uses: actions/deploy-pages@v4

  validate:
    name: Validar versión desplegada
    runs-on: ubuntu-latest
    needs: [build, deploy]
    env:
      PAGE_URL: ${{ needs.deploy.outputs.page_url }}
      EXPECTED_VERSION: ${{ needs.build.outputs.version }}
      EXPECTED_COMMIT: ${{ github.sha }}
    steps:
      - name: Comprobar version.json publicado
        run: |
          URL="${PAGE_URL%/}/version.json"
          echo "Validando $URL"

          for attempt in $(seq 1 12); do
            echo "Intento $attempt/12"
            if curl --fail --silent --show-error --location \
              -H "Cache-Control: no-cache" \
              "$URL?commit=$EXPECTED_COMMIT" \
              -o /tmp/version.json; then
              if python3 - <<'PY'
          import json, os, sys
          with open('/tmp/version.json', encoding='utf-8') as f:
              data = json.load(f)
          expected_version = os.environ['EXPECTED_VERSION']
          expected_commit = os.environ['EXPECTED_COMMIT']
          actual_version = str(data.get('version', ''))
          actual_commit = str(data.get('commit', ''))
          print(f"Esperado: version={expected_version} commit={expected_commit}")
          print(f"Publicado: version={actual_version} commit={actual_commit}")
          sys.exit(0 if actual_version == expected_version and actual_commit == expected_commit else 1)
          PY
              then
                echo "Despliegue validado correctamente."
                exit 0
              fi
            fi
            sleep 5
          done

          echo "ERROR: la versión publicada no coincide con la esperada tras los reintentos."
          exit 1

  notify:
    name: Notificar resultado
    needs: [build, deploy, validate]
    if: ${{ always() }}
    uses: Mikel-1970/CURSO-IA-CHAT-GPT/.github/workflows/notify-app-central.yml@main
    with:
      project: THE-CHEF
      version: ${{ needs.build.outputs.version }}
      app_url: ${{ needs.deploy.outputs.page_url }}
      build_result: ${{ needs.build.result }}
      deploy_result: ${{ needs.deploy.result }}
      validate_result: ${{ needs.validate.result }}
