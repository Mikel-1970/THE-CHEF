name: Generar imágenes estáticas de técnicas

on:
  workflow_dispatch:
    inputs:
      workers:
        description: "Generaciones en paralelo"
        required: false
        default: "3"
      force:
        description: "Regenerar también las ya existentes"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: \${{ github.ref_name }}

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar herramientas de imagen
        run: pip install pillow requests

      - name: Generar y comprimir catálogo
        env:
          TECHNIQUE_IMAGE_WORKERS: \${{ inputs.workers }}
        run: |
          if [ "\${{ inputs.force }}" = "true" ]; then
            python scripts/build-technique-images.py --force
          else
            python scripts/build-technique-images.py
          fi

      - name: Resumen de tamaño
        run: |
          du -sh public/technique-images || true
          find public/technique-images -type f -name '*.webp' | wc -l

      - name: Guardar catálogo en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/technique-images src/data/techniqueImageManifest.json
          if git diff --cached --quiet; then
            echo "No hay cambios."
            exit 0
          fi
          git commit -m "assets: añadir catálogo estático optimizado de técnicas"
          git push origin HEAD:\${GITHUB_REF_NAME}
